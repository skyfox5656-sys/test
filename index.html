<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>테트리스 게임</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <section class="game">
        <canvas id="tetris" width="300" height="600" aria-label="테트리스 게임판"></canvas>
      </section>
      <aside class="panel">
        <h1>테트리스</h1>
        <p class="score">점수: <span id="score">0</span></p>
        <p class="lines">라인: <span id="lines">0</span></p>
        <div class="next">
          <h2>다음 블록</h2>
          <canvas id="next" width="120" height="120" aria-label="다음 블록"></canvas>
        </div>
        <div class="controls">
          <h2>조작법</h2>
          <ul>
            <li>← → : 좌/우 이동</li>
            <li>↓ : 빠르게 내리기</li>
            <li>↑ 또는 Z : 회전</li>
            <li>스페이스 : 즉시 드롭</li>
            <li>P : 일시정지</li>
          </ul>
        </div>
        <button id="start" type="button">게임 시작</button>
      </aside>
    </main>
    <script src="script.js"></script>
  </body>
</html>
